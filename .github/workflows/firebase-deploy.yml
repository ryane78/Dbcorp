# Every push to main goes live on dbcorp.pk (Firebase Hosting, project dbuildcorp-a6a7a)
name: Deploy to dbcorp.pk

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to Ubuntu 26 in Oct 2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # a Node version the Firebase CLI supports
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DBUILDCORP_A6A7A }}
          channelId: live
          projectId: dbuildcorp-a6a7a
      # Tell Bing (ChatGPT search, Copilot), Yandex and other IndexNow engines the pages changed
      - name: Ping IndexNow
        run: |
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"dbcorp.pk","key":"792e47bee113bb3433fdb5669855c5c5","keyLocation":"https://dbcorp.pk/792e47bee113bb3433fdb5669855c5c5.txt","urlList":["https://dbcorp.pk/","https://dbcorp.pk/cost-calculator","https://dbcorp.pk/guide"]}'
