# Every push to main goes live on dbcorp.pk (Firebase Hosting, project dbuildcorp-a6a7a)
name: Deploy to dbcorp.pk

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DBUILDCORP_A6A7A }}
          channelId: live
          projectId: dbuildcorp-a6a7a
      # Tell Bing (ChatGPT search, Copilot), Yandex and other IndexNow engines the pages changed
      - name: Ping IndexNow
        run: |
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"dbcorp.pk","key":"792e47bee113bb3433fdb5669855c5c5","keyLocation":"https://dbcorp.pk/792e47bee113bb3433fdb5669855c5c5.txt","urlList":["https://dbcorp.pk/","https://dbcorp.pk/construction-cost-calculator.html"]}'
