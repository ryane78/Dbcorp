# Every pull request gets its own temporary preview link, posted as a comment on the PR
name: Preview on Firebase

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to Ubuntu 26 in Oct 2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # a Node version the Firebase CLI supports
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DBUILDCORP_A6A7A }}
          expires: 7d
          projectId: dbuildcorp-a6a7a
          firebaseToolsVersion: 15.34.0  # pinned: 15.34.1 (21 Oct 2026) broke deploys
